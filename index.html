<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#07080a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Classic Snake v1.1.0</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <style>
    :root{--ink:#07080a;--elevated:#14161c;--panel:#1a1d25;--fg:#eef0f3;--muted:#8b919a;--line:#2a303c;--mint:#7dffb3;--mint-fg:#06210f;--danger:#ff6b5a;--font:"Segoe UI",system-ui,sans-serif;--disp:"Trebuchet MS","Segoe UI",sans-serif;--mono:ui-monospace,Menlo,Consolas,monospace}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;height:100%;background:var(--ink);color:var(--fg);font-family:var(--font);overflow:hidden;overscroll-behavior:none}
    button{cursor:pointer;touch-action:manipulation}
    .shell{height:100dvh;display:flex;justify-content:center;user-select:none;overflow:hidden}
    .col{width:100%;max-width:480px;height:100%;min-height:0;display:flex;flex-direction:column;padding-inline:max(16px,env(safe-area-inset-left),env(safe-area-inset-right));padding-top:max(10px,env(safe-area-inset-top));padding-bottom:max(24px,env(safe-area-inset-bottom))}
    header{display:flex;align-items:center;gap:8px;min-height:44px}
    .brand{flex:1;min-width:0}
    h1{margin:0;font:600 13px/1.1 var(--disp);letter-spacing:.14em;text-transform:uppercase}
    .ver{display:inline-flex;align-items:center;height:18px;padding:0 7px;margin-top:3px;border-radius:999px;border:1px solid color-mix(in oklab,var(--fg) 16%,transparent);color:var(--muted);font:600 10px/1 var(--disp);letter-spacing:.08em}
    .hud,.best{min-width:52px;text-align:right;line-height:1.15}
    .hud .lv,.best .lbl{display:block;font:500 10px var(--disp);letter-spacing:.14em;color:var(--muted)}
    .hud .score,.best .val{font:600 15px var(--mono);font-variant-numeric:tabular-nums}
    .best.is-hot .val{color:var(--mint)}
    .icon{width:44px;height:44px;flex-shrink:0;display:grid;place-items:center;border:1px solid var(--line);background:var(--elevated);color:var(--fg);border-radius:12px}
    .slot{flex:1;min-height:0;display:grid;place-items:center;margin-top:8px}
    .stack{position:relative;width:var(--board,min(100%,70dvh));height:var(--board,min(100%,70dvh));max-width:100%;max-height:100%}
    .frame{width:100%;height:100%;border-radius:20px;padding:8px;background:var(--elevated);border:1px solid var(--line)}
    canvas{display:block;width:100%;height:100%;border-radius:12px;touch-action:none}
    .veil{position:absolute;inset:8px;z-index:10;display:flex;align-items:center;justify-content:center;border-radius:12px;background:color-mix(in oklab,var(--ink) 78%,transparent);overflow:auto}
    .card{margin:0 12px;width:100%;max-width:300px;border-radius:20px;border:1px solid var(--line);background:var(--elevated);padding:16px;text-align:center}
    .head{display:flex;align-items:center;justify-content:center;gap:8px}
    .kicker{margin:0;font:500 11px var(--disp);letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
    .kicker.danger{color:var(--danger)}
    .card h2{margin:8px 0 0;font:600 26px/1.1 var(--disp)}
    .tag{margin:8px 0 0;font-size:13px;color:var(--muted)}
    .hi{margin:12px 0 0;display:flex;justify-content:space-between;padding:8px 12px;border-radius:12px;border:1px solid var(--line)}
    .hi span:first-child{font:500 10px var(--disp);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
    .hi span:last-child{font:600 18px var(--mono)}
    .howto{margin:12px 0 0;text-align:left}
    .howto h3{margin:0 0 8px;text-align:center;font:500 11px var(--disp);letter-spacing:.18em;text-transform:uppercase;color:var(--mint)}
    .howto ol{list-style:none;margin:0;padding:0;display:grid;gap:8px}
    .howto li{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start;font-size:12px;line-height:1.4}
    .n{width:22px;height:22px;display:grid;place-items:center;border-radius:999px;background:var(--panel);color:var(--mint);font:600 11px var(--disp)}
    .big{margin:12px 0 0;font:600 40px/1 var(--mono)}
    .cta{margin-top:14px;height:48px;width:100%;border:0;border-radius:12px;background:var(--mint);color:var(--mint-fg);font:600 15px var(--disp);letter-spacing:.08em}
    .cta.ghost{margin-top:8px;height:44px;background:transparent;color:var(--fg);border:1px solid var(--line)}
    .meta{display:flex;justify-content:space-between;margin-top:8px;padding:0 4px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
    .dpad{--pad:clamp(48px,13.5vw,64px);display:grid;grid-template-columns:var(--pad) var(--pad) var(--pad);grid-template-rows:var(--pad) var(--pad) var(--pad);gap:6px;justify-content:center;margin:10px auto 0}
    .idle .dpad,.idle .meta{display:none}
    .db{display:flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;border:1px solid var(--line);background:var(--elevated);color:var(--fg);border-radius:12px}
    .db.pause{border-radius:999px;background:var(--panel);color:var(--mint)}
    .hidden{display:none!important}
    .drawer-root{position:fixed;inset:0;z-index:40}
    .backdrop{position:absolute;inset:0;border:0;width:100%;background:color-mix(in oklab,black 55%,transparent)}
    .drawer{position:absolute;inset:0 auto 0 0;width:min(22rem,86vw);background:var(--ink);border-right:1px solid var(--line);padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px;overflow:auto}
    .toggle{display:flex;justify-content:space-between;align-items:center;min-height:44px;border:0;background:none;color:var(--fg);width:100%;font:500 13px var(--disp)}
    .sw{width:48px;height:28px;border-radius:999px;background:var(--line);position:relative}
    .sw.on{background:var(--mint)}
    .sw i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:999px;background:var(--fg)}
    .sw.on i{transform:translateX(20px);background:var(--mint-fg)}
    @media(max-height:720px){.dpad{--pad:clamp(44px,12vw,56px)}.howto li{font-size:11px}}
  </style>
</head>
<body>
  <div class="shell"><div class="col idle" id="col">
    <header>
      <div class="brand"><h1>Classic Snake</h1><span class="ver">v1.1.0</span></div>
      <div class="hud"><span class="lv" id="hudLv">LV 1</span><span class="score" id="hudScore">0</span></div>
      <div class="best" id="bestChip"><span class="lbl">Best</span><span class="val" id="hudBest">0</span></div>
      <button class="icon" id="btnMenu" aria-label="Menu">☰</button>
    </header>
    <div class="slot" id="slot"><div class="stack">
      <div class="frame" id="board"><canvas id="c"></canvas></div>
      <div class="veil" id="overlay"></div>
    </div></div>
    <div class="meta"><span id="metaNext">0 / 10 to next level</span><span id="metaBest">Best 0</span></div>
    <div class="dpad">
      <span></span><button class="db" data-d="0,-1" aria-label="Up">▲</button><span></span>
      <button class="db" data-d="-1,0" aria-label="Left">◀</button>
      <button class="db pause" id="btnPause">❚❚</button>
      <button class="db" data-d="1,0" aria-label="Right">▶</button>
      <span></span><button class="db" data-d="0,1" aria-label="Down">▼</button><span></span>
    </div>
  </div></div>
  <div class="drawer-root hidden" id="drawer">
    <button class="backdrop" id="backdrop"></button>
    <aside class="drawer">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <strong>SETTINGS</strong><button class="icon" id="btnClose">✕</button>
      </div>
      <button class="toggle" id="wrapBtn">Wrap around walls <span class="sw" id="wrapSw"><i></i></span></button>
      <button class="toggle" id="soundBtn">Sound <span class="sw on" id="soundSw"><i></i></span></button>
    </aside>
  </div>
<script>
const VER="1.1.0", KEY="classic-snake-v1";
const BASE=168, STEP=14, MIN=55, START_LEN=3, PER=10, PTS=10;
const HOW=["Swipe, D-pad, or arrows / WASD to turn. Reverse into yourself is blocked.","Eat the pulsing block. Score is 10 \u00d7 current level per bite.","Every 10 bites: new level, snake resets to length 3, speed goes up. Score stays.","Hit a wall or yourself and the run ends \u2014 unless wrap-around is on."];
const canvas=document.getElementById("c"), ctx=canvas.getContext("2d");
const overlay=document.getElementById("overlay"), col=document.getElementById("col");
let grid=16, wrap=false, sound=true, status="ready", score=0, high=0, level=1, foods=0, beat=false;
let snake=[{x:8,y:8},{x:7,y:8},{x:6,y:8}], dir={x:1,y:0}, queued=null, food={x:12,y:8};
let last=0, acc=0, toast=null, toastT=0;
try{const s=JSON.parse(localStorage.getItem(KEY)||"{}"); high=s.high||0; wrap=!!s.wrap; sound=s.sound!==false;}catch(e){}
function save(){localStorage.setItem(KEY,JSON.stringify({high,wrap,sound}));}
function interval(){return Math.max(MIN,BASE-(level-1)*STEP);}
function spawn(){const used=new Set(snake.map(p=>p.x+","+p.y)); let p,g=0; do{p={x:Math.floor(Math.random()*grid),y:Math.floor(Math.random()*grid)};}while(used.has(p.x+","+p.y)&&++g<400); food=p;}
function resetSnake(){const m=Math.floor(grid/2); snake=[{x:m,y:m},{x:m-1,y:m},{x:m-2,y:m}]; dir={x:1,y:0}; queued=null; spawn();}
function beep(f,t){if(!sound)return; try{const A=new (window.AudioContext||window.webkitAudioContext)(); const o=A.createOscillator(), g=A.createGain(); o.frequency.value=f; o.connect(g); g.connect(A.destination); g.gain.value=.05; o.start(); o.stop(A.currentTime+(t||.06));}catch(e){}}
function setHigh(n){if(n>high){high=n; beat=true; save(); document.getElementById("bestChip").classList.add("is-hot");} document.getElementById("hudBest").textContent=high; document.getElementById("metaBest").textContent="Best "+high;}
function hud(){document.getElementById("hudLv").textContent="LV "+level; document.getElementById("hudScore").textContent=score; document.getElementById("metaNext").textContent=foods+" / "+PER+" to next level"; setHigh(score);}
function paintOverlay(){
  if(status==="playing"){overlay.classList.add("hidden"); col.classList.remove("idle"); return;}
  overlay.classList.remove("hidden");
  if(status==="ready"){
    col.classList.add("idle");
    overlay.innerHTML="<div class=\"card\"><div class=\"head\"><p class=\"kicker\">Playadda</p><span class=\"ver\">v"+VER+"</span></div><h2>Classic Snake</h2><p class=\"tag\">Eat. Grow. Don't crash.</p><div class=\"hi\"><span>High score</span><span>"+high+"</span></div><section class=\"howto\"><h3>How to play</h3><ol>"+HOW.map((t,i)=>"<li><span class=\"n\">"+(i+1)+"</span><span>"+t+"</span></li>").join("")+"</ol></section><button class=\"cta\" id=\"btnStart\">Start</button></div>";
  } else if(status==="paused"){
    overlay.innerHTML="<div class=\"card\"><p class=\"kicker\">PAUSED</p><p class=\"tag\">Tap to resume</p></div>";
  } else {
    overlay.innerHTML="<div class=\"card\"><div class=\"head\"><p class=\"kicker"+(beat?"":" danger")+"\">"+(beat?"New high score":"Game over")+"</p><span class=\"ver\">v"+VER+"</span></div><div class=\"big\">"+score+"</div><p class=\"tag\">Best "+high+"</p><button class=\"cta\" id=\"btnAgain\">Play again</button></div>";
  }
}
function play(){if(status==="over"){score=0;level=1;foods=0;beat=false;document.getElementById("bestChip").classList.remove("is-hot");resetSnake();} status="playing"; paintOverlay(); beep(660,.05);}
function over(){status="over"; setHigh(score); paintOverlay(); beep(180,.2);}
function pause(){if(status==="playing"){status="paused"; paintOverlay();} else if(status==="paused"){status="playing"; paintOverlay();}}
function queue(x,y){if(status!=="playing")return; if(dir.x===-x&&dir.y===-y)return; queued={x,y};}
function tick(){
  if(queued){dir=queued; queued=null;}
  const h=snake[0]; let nx=h.x+dir.x, ny=h.y+dir.y;
  if(wrap){nx=(nx+grid)%grid; ny=(ny+grid)%grid;}
  else if(nx<0||ny<0||nx>=grid||ny>=grid){over(); return;}
  if(snake.some(p=>p.x===nx&&p.y===ny)){over(); return;}
  snake.unshift({x:nx,y:ny});
  if(nx===food.x&&ny===food.y){score+=PTS*level; foods++; beep(880,.06); if(foods>=PER){level++; foods=0; resetSnake(); toast="LEVEL "+level; toastT=performance.now();} else spawn(); hud();}
  else snake.pop();
}
function resize(){const slot=document.getElementById("slot"); const s=Math.max(140,Math.floor(Math.min(slot.clientWidth,slot.clientHeight))); slot.style.setProperty("--board",s+"px"); const d=Math.floor(s*(window.devicePixelRatio||1)); canvas.width=d; canvas.height=d;}
function draw(now){
  const w=canvas.width, cell=w/grid;
  ctx.fillStyle="#0b0d12"; ctx.fillRect(0,0,w,w);
  ctx.strokeStyle="rgba(255,255,255,.05)"; ctx.lineWidth=1;
  for(let i=0;i<=grid;i++){ctx.beginPath();ctx.moveTo(i*cell,0);ctx.lineTo(i*cell,w);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*cell);ctx.lineTo(w,i*cell);ctx.stroke();}
  const pulse=.5+.5*Math.sin(now/180);
  ctx.fillStyle="rgba(255,77,77,"+(.7+.3*pulse)+")";
  ctx.beginPath(); ctx.arc((food.x+.5)*cell,(food.y+.5)*cell,cell*.32,0,Math.PI*2); ctx.fill();
  snake.forEach((p,i)=>{ctx.fillStyle=i===0?"#5dff9a":"#3aa86a"; ctx.fillRect(p.x*cell+cell*.12,p.y*cell+cell*.12,cell*.76,cell*.76);});
  if(toast&&now-toastT<900){ctx.fillStyle="#7dffb3"; ctx.font="600 "+Math.floor(cell)+"px sans-serif"; ctx.textAlign="center"; ctx.fillText(toast,w/2,w/2);}
}
function loop(now){
  requestAnimationFrame(loop);
  if(status==="playing"){acc+=now-last; const iv=interval(); while(acc>=iv){acc-=iv; tick();}}
  last=now; draw(now);
}
document.getElementById("overlay").addEventListener("click",e=>{
  if(e.target.id==="btnStart"||e.target.id==="btnAgain") play();
  else if(status==="paused") pause();
});
document.querySelectorAll("[data-d]").forEach(b=>b.addEventListener("pointerdown",()=>{const p=b.dataset.d.split(",").map(Number); queue(p[0],p[1]);}));
document.getElementById("btnPause").onclick=()=>pause();
document.getElementById("btnMenu").onclick=()=>{if(status==="playing")pause(); document.getElementById("drawer").classList.remove("hidden");};
document.getElementById("btnClose").onclick=document.getElementById("backdrop").onclick=()=>document.getElementById("drawer").classList.add("hidden");
document.getElementById("wrapBtn").onclick=()=>{wrap=!wrap; document.getElementById("wrapSw").classList.toggle("on",wrap); save();};
document.getElementById("soundBtn").onclick=()=>{sound=!sound; document.getElementById("soundSw").classList.toggle("on",sound); save();};
window.addEventListener("keydown",e=>{
  const map={ArrowUp:[0,-1],KeyW:[0,-1],ArrowDown:[0,1],KeyS:[0,1],ArrowLeft:[-1,0],KeyA:[-1,0],ArrowRight:[1,0],KeyD:[1,0]};
  if(map[e.code]){queue(map[e.code][0],map[e.code][1]); e.preventDefault();}
  if(e.code==="Space"||e.code==="KeyP"){if(status==="ready"||status==="over")play(); else pause(); e.preventDefault();}
  if(e.code==="Enter"&&(status==="ready"||status==="over")) play();
  if(e.code==="Escape") document.getElementById("drawer").classList.add("hidden");
});
let sx,sy;
document.getElementById("board").addEventListener("pointerdown",e=>{sx=e.clientX;sy=e.clientY;});
document.getElementById("board").addEventListener("pointerup",e=>{
  if(sx==null)return; const dx=e.clientX-sx, dy=e.clientY-sy; sx=null;
  if(Math.hypot(dx,dy)<24)return; if(Math.abs(dx)>Math.abs(dy)) queue(dx>0?1:-1,0); else queue(0,dy>0?1:-1);
});
window.addEventListener("resize",resize);
resetSnake(); hud(); paintOverlay(); resize();
window.__snake=window.__controlsTest={getState:()=>status,getScore:()=>score,getHigh:()=>high,getLevel:()=>level,start:play,queueDir:queue};
requestAnimationFrame(t=>{last=t; loop(t);});
</script>
</body>
</html>
