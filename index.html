<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#07080a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Classic Snake. Eat, grow, survive." />
  <title>Classic Snake</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <style>
    :root {
      --ink: #07080a;
      --elevated: #14161c;
      --panel: #1a1d25;
      --fg: #eef0f3;
      --muted: #8b919a;
      --subtle: #5c6370;
      --line: #2a303c;
      --mint: #7dffb3;
      --mint-fg: #06210f;
      --danger: #ff6b5a;
      --font-display: "Trebuchet MS", "Avenir Next Condensed", "Segoe UI", system-ui, sans-serif;
      --font-sans: "Segoe UI", system-ui, -apple-system, sans-serif;
      --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; height: 100%;
      background: var(--ink); color: var(--fg);
      font-family: var(--font-sans);
      overflow: hidden; overscroll-behavior: none;
      -webkit-font-smoothing: antialiased;
    }
    button:not(:disabled) { cursor: pointer; touch-action: manipulation; }
    .shell {
      height: 100vh; height: 100dvh; height: 100svh; max-height: 100dvh;
      display: flex; justify-content: center;
      user-select: none; -webkit-user-select: none;
      overflow: hidden;
    }
    .col {
      width: 100%; max-width: 480px; height: 100%; min-height: 0;
      display: flex; flex-direction: column;
      padding-inline: max(16px, env(safe-area-inset-left), env(safe-area-inset-right));
      padding-top: max(10px, env(safe-area-inset-top));
      padding-bottom: max(24px, env(safe-area-inset-bottom));
    }
    header {
      display: flex; align-items: center; gap: 8px;
      height: 44px; flex: 0 0 auto;
    }
    .icon-btn {
      width: 44px; height: 44px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      border: 1px solid var(--line); background: var(--elevated); color: var(--fg);
      border-radius: 12px;
    }
    h1 {
      flex: 1; min-width: 0; margin: 0; text-align: center;
      font-family: var(--font-display); font-size: 13px; font-weight: 600;
      letter-spacing: 0.22em;
    }
    .hud { min-width: 72px; text-align: right; line-height: 1.15; }
    .hud .lv {
      display: block; font-family: var(--font-display);
      font-size: 10px; font-weight: 500; letter-spacing: 0.14em; color: var(--muted);
    }
    .hud .score {
      font-family: var(--font-mono); font-size: 15px; font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .spacer { display: none; }
    .board-slot {
      flex: 1 1 auto; min-height: 0; min-width: 0; width: 100%;
      display: grid; place-items: center; margin-top: 8px;
    }
    .board-stack {
      position: relative;
      width: var(--board, min(100%, 70dvh));
      height: var(--board, min(100%, 70dvh));
      max-width: 100%; max-height: 100%;
    }
    .board-frame {
      position: relative; width: 100%; height: 100%;
      border-radius: 20px; padding: 8px;
      background: var(--elevated); border: 1px solid var(--line);
      box-shadow: 0 18px 48px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.04);
      touch-action: none;
    }
    .board-frame canvas {
      display: block; width: 100%; height: 100%;
      border-radius: 12px; touch-action: none;
    }
    .veil {
      position: absolute; inset: 8px; z-index: 10;
      display: flex; align-items: center; justify-content: center;
      border-radius: 12px;
      background: color-mix(in oklab, var(--ink) 72%, transparent);
      pointer-events: auto; touch-action: manipulation;
    }
    .veil.pause { background: color-mix(in oklab, var(--ink) 58%, transparent); border: 0; width: auto; }
    .card {
      margin: 0 24px; width: 100%; max-width: 260px;
      border-radius: 20px; border: 1px solid var(--line);
      background: var(--elevated); padding: 20px; text-align: center;
      animation: overlay-in 250ms cubic-bezier(0.22,1,0.36,1);
    }
    .kicker {
      font-family: var(--font-display); font-size: 11px; font-weight: 500;
      letter-spacing: 0.22em; color: var(--muted); margin: 0;
    }
    .kicker.danger { color: var(--danger); }
    .card h2 {
      margin: 8px 0 0; font-family: var(--font-display);
      font-size: 28px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.1;
    }
    .card p { margin: 8px 0 0; font-size: 14px; color: var(--muted); line-height: 1.35; }
    .big-score {
      margin: 12px 0 0; font-family: var(--font-mono);
      font-size: 40px; font-weight: 600; line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .cta {
      margin-top: 16px; height: 48px; width: 100%;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      border: 0; border-radius: 12px;
      background: var(--mint); color: var(--mint-fg);
      font-family: var(--font-display); font-size: 15px; font-weight: 600; letter-spacing: 0.08em;
      animation: pulse-play 2.4s ease-in-out infinite;
      touch-action: manipulation;
    }
    .cta:active { transform: scale(0.98); }
    .cta.ghost {
      margin-top: 8px; height: 44px;
      background: transparent; color: var(--fg); border: 1px solid var(--line);
      animation: none; font-size: 13px;
    }
    .toast {
      pointer-events: none; position: absolute; left: 50%; top: 50%; z-index: 20;
      transform: translate(-50%, -50%);
      border-radius: 12px; border: 1px solid var(--line);
      background: var(--elevated); padding: 8px 20px;
      font-family: var(--font-display); font-size: 13px; font-weight: 600;
      letter-spacing: 0.22em; color: var(--mint);
      animation: toast-in 250ms cubic-bezier(0.22,1,0.36,1);
    }
    .meta {
      flex: 0 0 auto;
      margin-top: 8px; display: flex; justify-content: space-between;
      padding: 0 4px; font-size: 12px; color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .dpad {
      --pad: clamp(48px, 13.5vw, 64px);
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: var(--pad) var(--pad) var(--pad);
      grid-template-rows: var(--pad) var(--pad) var(--pad);
      gap: 6px; justify-content: center; margin: 10px auto 0;
      touch-action: none;
    }
    .dpad-btn {
      display: flex; align-items: center; justify-content: center;
      min-width: 44px; min-height: 44px;
      border: 1px solid var(--line); background: var(--elevated); color: var(--fg);
      border-radius: 12px; touch-action: none;
    }
    .dpad-btn:active, .dpad-btn.is-down { transform: scale(0.96); background: var(--panel); }
    .dpad-btn.pause { border-radius: 999px; background: var(--panel); color: var(--mint); }
    .hidden { display: none !important; }
    .drawer-root { position: fixed; inset: 0; z-index: 40; }
    .backdrop {
      position: absolute; inset: 0;
      background: color-mix(in oklab, black 55%, transparent);
      border: 0; width: 100%;
      animation: fade-in 250ms cubic-bezier(0.22,1,0.36,1);
    }
    .drawer {
      position: absolute; inset: 0 auto 0 0;
      width: min(22rem, 86vw);
      display: flex; flex-direction: column;
      background: var(--ink); border-right: 1px solid var(--line);
      padding-top: max(16px, env(safe-area-inset-top));
      animation: drawer-in 400ms cubic-bezier(0.22,1,0.36,1);
    }
    .drawer-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px 12px;
    }
    .drawer-head h2 {
      margin: 0; font-family: var(--font-display);
      font-size: 13px; font-weight: 600; letter-spacing: 0.18em;
    }
    .drawer-body {
      min-height: 0; flex: 1; overflow-y: auto;
      padding: 0 16px 32px; display: flex; flex-direction: column; gap: 20px;
    }
    .label {
      margin: 0 0 8px; font-family: var(--font-display);
      font-size: 11px; font-weight: 500; letter-spacing: 0.16em; color: var(--muted);
    }
    .swatches { display: flex; flex-wrap: wrap; gap: 10px; }
    .swatch {
      width: 32px; height: 32px; border-radius: 999px;
      border: 2px solid transparent;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.12);
    }
    .swatch[data-active="true"] {
      border-color: var(--fg);
      box-shadow: 0 0 0 2px var(--ink), 0 0 0 4px var(--fg);
    }
    .theme-swatch {
      width: 44px; height: 32px; border-radius: 8px;
      border: 2px solid transparent;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.1);
    }
    .theme-swatch[data-active="true"] { border-color: var(--fg); }
    .slider-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
    .slider-head .val { font-family: var(--font-mono); font-size: 12px; font-variant-numeric: tabular-nums; }
    .slider-wrap { position: relative; display: flex; align-items: center; height: 28px; }
    .slider-track, .slider-fill {
      pointer-events: none; position: absolute; left: 0; height: 4px; border-radius: 999px;
    }
    .slider-track { right: 0; background: var(--line); }
    .slider-fill { background: var(--fg); }
    input[type="range"] {
      -webkit-appearance: none; appearance: none;
      width: 100%; height: 28px; background: transparent; margin: 0; position: relative; z-index: 1;
    }
    input[type="range"]::-webkit-slider-runnable-track { height: 4px; background: transparent; }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 18px; height: 18px; margin-top: -7px;
      border-radius: 999px; background: var(--fg); border: 0;
      box-shadow: 0 0 0 3px var(--ink);
    }
    input[type="range"]::-moz-range-track { height: 4px; background: transparent; border: 0; }
    input[type="range"]::-moz-range-thumb {
      width: 18px; height: 18px; border-radius: 999px; background: var(--fg); border: 0;
      box-shadow: 0 0 0 3px var(--ink);
    }
    .hint { margin: 4px 0 0; font-size: 11px; color: var(--subtle); }
    .toggle-row {
      display: flex; width: 100%; align-items: center; justify-content: space-between;
      background: none; border: 0; color: var(--fg); padding: 4px 0;
      font-family: var(--font-display); font-size: 13px; font-weight: 500; letter-spacing: 0.04em;
      min-height: 44px;
    }
    .toggle {
      width: 48px; height: 28px; border-radius: 999px; background: var(--line); position: relative;
    }
    .toggle[data-on="true"] { background: var(--mint); }
    .toggle-knob {
      position: absolute; top: 3px; left: 3px; width: 22px; height: 22px;
      border-radius: 999px; background: var(--fg); transition: transform 150ms cubic-bezier(0.22,1,0.36,1);
    }
    .toggle[data-on="true"] .toggle-knob { transform: translateX(20px); background: var(--mint-fg); }
    @keyframes overlay-in { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
    @keyframes toast-in {
      from { opacity: 0; transform: translate(-50%, -46%) scale(0.96); }
      to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }
    @keyframes drawer-in { from { transform: translateX(-100%); } to { transform: translateX(0); } }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pulse-play {
      0%, 100% { box-shadow: 0 0 0 0 color-mix(in oklab, var(--mint) 35%, transparent); }
      50% { box-shadow: 0 0 0 8px color-mix(in oklab, var(--mint) 0%, transparent); }
    }
    @media (max-height: 720px) {
      .dpad { --pad: clamp(44px, 12vw, 56px); gap: 4px; margin-top: 8px; }
      .card h2 { font-size: clamp(22px, 7vw, 28px); }
      .big-score { font-size: clamp(28px, 10vw, 40px); }
    }
    @media (orientation: landscape) and (max-height: 560px) {
      .col {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        grid-template-rows: auto minmax(0, 1fr) auto;
        grid-template-areas: "header dpad" "board dpad" "hud dpad";
        column-gap: 12px; max-width: 920px;
        padding-bottom: max(12px, env(safe-area-inset-bottom));
      }
      header { grid-area: header; }
      .board-slot { grid-area: board; margin-top: 4px; }
      .meta { grid-area: hud; margin-top: 4px; }
      .dpad { grid-area: dpad; align-self: center; margin: 0 4px 0 0; --pad: clamp(44px, 18vh, 56px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .card, .toast, .drawer, .backdrop, .cta { animation: none; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="col">
      <header>
        <button type="button" class="icon-btn" id="btnMenu" aria-label="Open menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <h1>CLASSIC SNAKE</h1>
        <div class="hud">
          <span class="lv" id="hudLevel">LV 1</span>
          <span class="score" id="hudScore">0</span>
        </div>
      </header>
      <div class="board-slot" id="slot">
        <div class="board-stack">
          <div class="board-frame" id="board">
            <canvas id="canvas" aria-label="Snake board"></canvas>
          </div>
          <div class="veil" id="overlay">
            <div class="card" id="overlayCard"></div>
          </div>
          <button type="button" class="veil pause hidden" id="pauseVeil" aria-label="Resume">
            <div class="card">
              <p class="kicker">PAUSED</p>
              <p>Tap to resume</p>
            </div>
          </button>
          <div class="toast hidden" id="toast"></div>
        </div>
      </div>
      <div class="meta">
        <span id="metaNext">0 / 10 to next level</span>
        <span id="metaBest">Best 0</span>
      </div>
      <div class="dpad" id="dpad">
        <span></span>
        <button type="button" class="dpad-btn" data-dir="0,-1" aria-label="Up">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 15l-6-6-6 6"/></svg>
        </button>
        <span></span>
        <button type="button" class="dpad-btn" data-dir="-1,0" aria-label="Left">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <button type="button" class="dpad-btn pause" id="btnPause" aria-label="Pause">
          <svg id="iconPause" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 5v14M16 5v14"/></svg>
          <svg id="iconPlay" class="hidden" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button type="button" class="dpad-btn" data-dir="1,0" aria-label="Right">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
        </button>
        <span></span>
        <button type="button" class="dpad-btn" data-dir="0,1" aria-label="Down">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <span></span>
      </div>
    </div>
  </div>

  <div class="drawer-root hidden" id="drawerRoot">
    <button type="button" class="backdrop" id="backdrop" aria-label="Close menu"></button>
    <aside class="drawer" role="dialog" aria-label="Settings">
      <div class="drawer-head">
        <h2>SETTINGS</h2>
        <button type="button" class="icon-btn" id="btnClose" aria-label="Close">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="drawer-body">
        <div>
          <p class="label">Snake</p>
          <div class="swatches" id="snakeSwatches"></div>
        </div>
        <div>
          <p class="label">Food</p>
          <div class="swatches" id="foodSwatches"></div>
        </div>
        <div>
          <p class="label">Board</p>
          <div class="swatches" id="themeSwatches"></div>
        </div>
        <div>
          <div class="slider-head"><p class="label">Grid size</p><span class="val" id="gridVal">16 × 16</span></div>
          <div class="slider-wrap">
            <div class="slider-track"></div>
            <div class="slider-fill" id="gridFill"></div>
            <input type="range" id="gridSlider" min="10" max="24" value="16" aria-label="Grid size" />
          </div>
          <p class="hint">Applies on a new game</p>
        </div>
        <div>
          <div class="slider-head"><p class="label">Snake thickness</p><span class="val" id="thickVal">78%</span></div>
          <div class="slider-wrap">
            <div class="slider-track"></div>
            <div class="slider-fill" id="thickFill"></div>
            <input type="range" id="thickSlider" min="50" max="95" value="78" aria-label="Snake thickness" />
          </div>
        </div>
        <button type="button" class="toggle-row" id="wrapToggle" aria-pressed="false">
          Wrap around walls
          <span class="toggle" data-on="false"><span class="toggle-knob"></span></span>
        </button>
        <button type="button" class="toggle-row" id="soundToggle" aria-pressed="true">
          Sound
          <span class="toggle" data-on="true"><span class="toggle-knob"></span></span>
        </button>
      </div>
    </aside>
  </div>

<script>
const SNAKE_COLORS = ["#5dff9a","#5ce1e6","#9ec8ff","#ff7a6e","#f4f4f5","#ffc857"];
const FOOD_COLORS = ["#ff4d4d","#ff8a3d","#ffd166","#ff6b9d","#f4f4f5","#5ce1e6"];
const THEMES = [
  { id: "ink", name: "Ink", bg: "#0b0d12", grid: "rgba(255,255,255,0.055)" },
  { id: "phosphor", name: "Phosphor", bg: "#07140c", grid: "rgba(125,255,179,0.08)" },
  { id: "deep", name: "Deep", bg: "#0a1020", grid: "rgba(140,180,255,0.08)" },
  { id: "carbon", name: "Carbon", bg: "#101010", grid: "rgba(255,255,255,0.045)" },
  { id: "dusk", name: "Dusk", bg: "#14110f", grid: "rgba(255,200,150,0.07)" },
];
const DEFAULT_SETTINGS = {
  snakeColor: SNAKE_COLORS[0], foodColor: FOOD_COLORS[0], themeId: "ink",
  gridSize: 16, thickness: 0.78, wrap: false, sound: true,
};
const STORAGE_KEY = "classic-snake-v1";
const BASE_INTERVAL = 168, LEVEL_STEP = 14, MIN_INTERVAL = 55;
const START_LENGTH = 3, FOODS_PER_LEVEL = 10, POINTS_PER_FOOD = 10;
const GAME_CODES = new Set(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","KeyW","KeyA","KeyS","KeyD","Space","KeyP"]);

function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }
function hexToRgb(hex) {
  const h = hex.replace("#", "");
  const n = parseInt(h.length === 3 ? h.split("").map(c => c + c).join("") : h, 16);
  return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
}
function withAlpha(hex, a) { const { r, g, b } = hexToRgb(hex); return `rgba(${r},${g},${b},${a})`; }
function darken(hex, amount) {
  const { r, g, b } = hexToRgb(hex); const k = 1 - amount;
  return `rgb(${Math.round(r * k)},${Math.round(g * k)},${Math.round(b * k)})`;
}
function intervalFor(level) { return Math.max(MIN_INTERVAL, BASE_INTERVAL - (level - 1) * LEVEL_STEP); }
function keyDir(code) {
  if (code === "ArrowUp" || code === "KeyW") return { x: 0, y: -1 };
  if (code === "ArrowDown" || code === "KeyS") return { x: 0, y: 1 };
  if (code === "ArrowLeft" || code === "KeyA") return { x: -1, y: 0 };
  if (code === "ArrowRight" || code === "KeyD") return { x: 1, y: 0 };
  return null;
}
function loadSave() {
  const fallback = { highScore: 0, settings: { ...DEFAULT_SETTINGS } };
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return fallback;
    const parsed = JSON.parse(raw);
    const settings = { ...DEFAULT_SETTINGS, ...(parsed.settings || {}) };
    settings.gridSize = clamp(Math.round(settings.gridSize), 10, 24);
    settings.thickness = clamp(settings.thickness, 0.5, 0.95);
    if (!THEMES.some(t => t.id === settings.themeId)) settings.themeId = "ink";
    return { highScore: Math.max(0, Number(parsed.highScore) || 0), settings };
  } catch { return fallback; }
}
function persist(highScore, settings) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ version: 1, highScore, settings })); } catch {}
}
function splitWrapped(body) {
  const groups = []; let cur = [];
  for (let i = 0; i < body.length; i++) {
    const p = body[i];
    if (i === 0) { cur.push(p); continue; }
    const prev = body[i - 1];
    if (Math.abs(prev.x - p.x) > 1.05 || Math.abs(prev.y - p.y) > 1.05) { groups.push(cur); cur = [p]; }
    else cur.push(p);
  }
  if (cur.length) groups.push(cur);
  return groups;
}
function roundRect(ctx, x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}

class SnakeEngine {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext("2d", { alpha: false });
    const save = loadSave();
    this.settings = save.settings;

const canvas = document.getElementById("canvas");
const engine = new SnakeEngine(canvas);
let menuOpen = false;
const els = {
  overlay: document.getElementById("overlay"),
  overlayCard: document.getElementById("overlayCard"),
  pauseVeil: document.getElementById("pauseVeil"),
  toast: document.getElementById("toast"),
  hudLevel: document.getElementById("hudLevel"),
  hudScore: document.getElementById("hudScore"),
  metaNext: document.getElementById("metaNext"),
  metaBest: document.getElementById("metaBest"),
  drawerRoot: document.getElementById("drawerRoot"),
  iconPause: document.getElementById("iconPause"),
  iconPlay: document.getElementById("iconPlay"),
  btnPause: document.getElementById("btnPause"),
};

function bindPlay(btn) {
  if (!btn) return;
  const go = (e) => {
    e.preventDefault();
    e.stopPropagation();
    if (engine.status === "playing") return;
    engine.play();
  };
  btn.addEventListener("pointerup", go);
  btn.addEventListener("click", go);
}

function renderOverlay(snap) {
  if (snap.status === "ready") {
    els.overlayCard.innerHTML =
      '<p class="kicker">ARCADE</p><h2>Classic Snake</h2>' +
      "<p>Eat blocks. Grow. Don't hit the wall.</p>" +
      '<button type="button" class="cta" id="btnPlay"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>Play</button>';
    els.overlay.classList.remove("hidden");
    bindPlay(document.getElementById("btnPlay"));
  } else if (snap.status === "over") {
    els.overlayCard.innerHTML =
      '<p class="kicker danger">GAME OVER</p>' +
      '<p class="big-score">' + snap.score + '</p>' +
      '<p>Level ' + snap.level + '</p>' +
      '<button type="button" class="cta" id="btnAgain"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>Play again</button>' +
      '<button type="button" class="cta ghost" id="btnSettings">Settings</button>';
    els.overlay.classList.remove("hidden");
    bindPlay(document.getElementById("btnAgain"));
    document.getElementById("btnSettings").onclick = openMenu;
  } else {
    els.overlay.classList.add("hidden");
  }
  const paused = snap.status === "paused" && !menuOpen;
  els.pauseVeil.classList.toggle("hidden", !paused);
  els.iconPause.classList.toggle("hidden", paused);
  els.iconPlay.classList.toggle("hidden", !paused);
  els.btnPause.setAttribute("aria-label", paused ? "Resume" : "Pause");
  if (snap.toast) { els.toast.textContent = snap.toast; els.toast.classList.remove("hidden"); }
  else els.toast.classList.add("hidden");
}

function renderHud(snap) {
  els.hudLevel.textContent = "LV " + snap.level;
  els.hudScore.textContent = snap.score;
  els.metaNext.textContent = snap.foodsThisLevel + " / 10 to next level";
  els.metaBest.textContent = "Best " + snap.highScore;
}

function setToggle(id, on) {
  const btn = document.getElementById(id);
  btn.setAttribute("aria-pressed", on ? "true" : "false");
  btn.querySelector(".toggle").setAttribute("data-on", on ? "true" : "false");
}
function fillSwatches(rootId, colors, value, onPick, theme) {
  const root = document.getElementById(rootId);
  root.innerHTML = "";
  colors.forEach(c => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = theme ? "theme-swatch" : "swatch";
    b.style.background = theme ? c.bg : c;
    b.setAttribute("data-active", theme ? c.id === value : c.toLowerCase() === value.toLowerCase());
    b.setAttribute("aria-label", theme ? c.name : c);
    b.onclick = () => onPick(c);
    root.appendChild(b);
  });
}
function renderSettings(s) {
  fillSwatches("snakeSwatches", SNAKE_COLORS, s.snakeColor, c => engine.setSettings({ snakeColor: c }));
  fillSwatches("foodSwatches", FOOD_COLORS, s.foodColor, c => engine.setSettings({ foodColor: c }));
  fillSwatches("themeSwatches", THEMES, s.themeId, t => engine.setSettings({ themeId: t.id }), true);
  document.getElementById("gridSlider").value = s.gridSize;
  document.getElementById("gridVal").textContent = s.gridSize + " × " + s.gridSize;
  document.getElementById("gridFill").style.width = ((s.gridSize - 10) / 14 * 100) + "%";
  document.getElementById("thickSlider").value = Math.round(s.thickness * 100);
  document.getElementById("thickVal").textContent = Math.round(s.thickness * 100) + "%";
  document.getElementById("thickFill").style.width = ((s.thickness * 100 - 50) / 45 * 100) + "%";
  setToggle("wrapToggle", s.wrap);
  setToggle("soundToggle", s.sound);
}

function openMenu() {
  if (engine.status === "playing") engine.togglePause();
  menuOpen = true;
  els.drawerRoot.classList.remove("hidden");
  renderSettings(engine.settings);
  renderOverlay(engine.snapshot());
}
function closeMenu() {
  menuOpen = false;
  els.drawerRoot.classList.add("hidden");
  renderOverlay(engine.snapshot());
}

engine.onChange = (snap) => { renderHud(snap); renderOverlay(snap); if (menuOpen) renderSettings(snap.settings); };
engine.startLoop();
renderHud(engine.snapshot());
renderOverlay(engine.snapshot());
renderSettings(engine.settings);

document.getElementById("btnMenu").onclick = openMenu;
document.getElementById("btnClose").onclick = closeMenu;
document.getElementById("backdrop").onclick = closeMenu;
document.getElementById("pauseVeil").onpointerup = (e) => { e.preventDefault(); e.stopPropagation(); engine.resume(); };
document.getElementById("pauseVeil").onclick = () => engine.resume();
document.getElementById("btnPause").onpointerdown = (e) => { e.preventDefault(); engine.togglePause(); };
document.getElementById("overlay").onpointerdown = (e) => e.stopPropagation();
document.getElementById("overlay").onpointerup = (e) => e.stopPropagation();
document.getElementById("board").onpointerdown = (e) => {
  if (engine.status !== "playing") return;
  engine.onPointerDown(e);
};
document.getElementById("board").onpointermove = (e) => engine.onPointerMove(e);
document.getElementById("board").onpointerup = (e) => engine.onPointerUp(e);
document.getElementById("board").onpointercancel = (e) => engine.onPointerUp(e);
document.querySelectorAll(".dpad-btn[data-dir]").forEach(btn => {
  btn.onpointerdown = (e) => {
    e.preventDefault();
    const [x, y] = btn.dataset.dir.split(",").map(Number);
    engine.queueDir(x, y);
  };
});
document.getElementById("gridSlider").oninput = (e) => engine.setSettings({ gridSize: Number(e.target.value) });
document.getElementById("thickSlider").oninput = (e) => engine.setSettings({ thickness: Number(e.target.value) / 100 });
document.getElementById("wrapToggle").onclick = () => engine.setSettings({ wrap: !engine.settings.wrap });
document.getElementById("soundToggle").onclick = () => engine.setSettings({ sound: !engine.settings.sound });
window.addEventListener("keydown", (e) => {
  if (e.code === "Escape") { closeMenu(); return; }
  if (engine.handleKey(e.code, menuOpen) || (GAME_CODES.has(e.code) && !menuOpen)) e.preventDefault();
});
document.addEventListener("visibilitychange", () => engine.onVisibility());
window.addEventListener("resize", () => engine.resize());
window.addEventListener("orientationchange", () => engine.resize());
(function sizeBoard() {
  const slot = document.getElementById("slot");
  const apply = () => {
    const size = Math.max(140, Math.floor(Math.min(slot.clientWidth, slot.clientHeight)));
    slot.style.setProperty("--board", size + "px");
    engine.resize();
  };
  apply();
  if (window.ResizeObserver) new ResizeObserver(apply).observe(slot);
})();
</script>
</body>
</html>
